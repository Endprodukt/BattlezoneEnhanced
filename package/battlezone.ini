; Battlezone Enhanced: the settings that come with the program.
; Your own go into save/battlezone.ini (same keys); what stands there wins.

; A folder or zip with the ROMs (MAME's bzone.zip). Empty: the usual places
; (--roms, $BZ_ROMS, ./roms, the folders of advmame.rc).
rom_path =

; The cabinet's option switches
lives = 3
; the missile appears from this score on: 5000, 10000, 20000 or 30000
missile_at = 10000
; a bonus tank at 15000, 25000 or 50000 (and at 100000); 0: none
bonus_at = 15000
; english, german, french, spanish
language = english
; free, 2plays (for a coin), 1play, 2coins (for a play)
coin_mode = 1play

; How the tank is driven: one digital joystick (or the arrow keys), two
; digital joysticks (the cabinet's two levers; keys E D, I K) and a yoke or
; analog stick all work at once, whatever is plugged in. A lever of the two
; joysticks held drives as the levers; else the yoke out of its dead zone;
; else the one joystick.
; the yoke's dead zone, as a fraction of its travel
deadzone = 0.08
; What every action is bound to. auto: the cabinet's own control (advmame.rc)
; or the PC's default. Else: none, "key NAME" (SDL's name of the key),
; "joyN button K", "joyN axis K +" or "-", "joyN hat K up" (down, left,
; right). Up to eight joined by " or ", as in MAME: "auto or joy2 button 3"
; fires with the cabinet's button and with that one. The test menu writes
; these for you (fire on a line, then the new one: it is added).
bind_up = auto
bind_down = auto
bind_left = auto
bind_right = auto
bind_left_fwd = auto
bind_left_back = auto
bind_right_fwd = auto
bind_right_back = auto
bind_drive = auto
bind_turn = auto
bind_fire = auto
bind_start = auto
bind_coin = auto
volume = 0.8
; 1: WAV files in sounds/ (next to the program, or in save/sounds) play in
; place of the board's own sounds, each named after the sound it replaces
; (docs/SOUNDS.md). A pack comes with the program: the
; shot of Battle Zone II, explosions and tank engines from Freesound (CC0). 0: the
; board's sounds only.
sound_replace = 1

; Pictures between the game's 15 frames a second, as many as the screen
; takes. 1: computed (everything that moves is put where it is between two
; frames and the game's own routines draw that, as the Star Wars port does
; it). 2: the lines of a frame's picture moved to where the next one's are.
; 0: every frame's picture as the cabinet shows it.
smooth = 1

; flyer: every line by what it is, in the colors of Atari's flyer of 1980.
; color: the same with the first palette (green land, blue obstacles).
; overlay: as the cabinet's color overlay, the top fifth red and the rest
; green. white: one color.
color_mode = flyer

; 1: a grid on the ground, as on Atari's flyer. 0: the cabinet's empty ground.
ground_grid = 1

; The enhanced options, each 1 (on) or 0 (also in the test menu):
; sparks when the enemy or the saucer is hit, in the color of what was hit
enh_particles = 1
; stars over the mountains, twinkling
enh_stars = 1
; a second row of mountains behind the first, turning slower with the view
enh_far = 1
; the volcano's rocks glow as they rise
enh_volcano = 1
; a flash when you fire, dust where a shell comes down
enh_flash = 1
; with analog controls: gauges for the two levers
enh_levers = 1
; the enemy's and the saucer's sounds from the side they are on
enh_stereo = 1
; and quieter the farther away they are
enh_distance = 1
; the enemy tank's engine, from where he is, louder near (with sound_replace)
enh_enemy_engine = 1
; the engines a little softer while the radar beeps, a tune plays, a shot or
; an explosion is heard
enh_ducking = 1
; with analog controls: the engine revs with how far the levers are pushed
enh_engine = 1
; the cabinet's pace: a frame takes as long as its 6502 took (14.6 to 15
; frames a second, slower in full scenes). 0: always 15.3
enh_tempo = 0

; the test menu also opens when start and fire are held together for two seconds
menu_hold = 1
; the test menu's own key or button besides Tab (as the other bindings)
bind_menu = auto
; on the cabinet: the START lamp as the game switches it
start_lamp = 1

; 1: objects are solid, what is behind them is not drawn. 0: wire frames
; you can see through, as the cabinet draws them.
occlusion = 1
color = 255 255 255
color_top = 255 32 32
color_bottom = 32 255 32
overlay_split = 0.2
brightness = 1.3
gamma = 1.0
floor = 0.15
; Pictures a second on the vector board. The board redraws its last
; picture at its own refresh rate (the cabinet's menu: DVG REFRESH); this
; has to be the same, or pictures are shown twice and skipped by turns.
board_hz = 50

; The part of the vector generator's field that is shown (what the game
; draws in: 512 by 384; MAME shows -290..290 by -200..200), and the
; margins on the tube, in board units of 0..4095
view_left = -256
view_right = 256
view_bottom = -192
view_top = 192
margin_left = 64
margin_right = 64
margin_bottom = 64
margin_top = 64
flip_x = 0
flip_y = 0
